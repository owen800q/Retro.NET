name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # main publishes 1.0.<run>; every other ref builds a CI pre-release that is never pushed.
  PACKAGE_VERSION: ${{ github.ref == 'refs/heads/main' && format('1.0.{0}', github.run_number) || format('1.0.{0}-ci', github.run_number) }}

jobs:
  build-test:
    name: Build, test & pack (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Retro.NET.slnx

      - name: Build
        run: dotnet build Retro.NET.slnx -c Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test
        env:
          RETRO_SNAPSHOTS: ${{ github.workspace }}/artifacts/snapshots
        run: dotnet test tests/Retro.Wpf.Tests/Retro.Wpf.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Upload test results & UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: |
            artifacts/snapshots
            artifacts/test-results
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack src/Retro.Wpf/Retro.Wpf.csproj -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
