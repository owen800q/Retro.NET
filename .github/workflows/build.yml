name: build

on:
  push:
    branches-ignore: ['ci-snapshots']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # main publishes 1.0.<run>; every other ref builds a CI pre-release that is never pushed.
  PACKAGE_VERSION: ${{ github.ref == 'refs/heads/main' && format('1.0.{0}', github.run_number) || format('1.0.{0}-ci', github.run_number) }}

jobs:
  build-test:
    name: Build, test & pack (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # pushes UI snapshots to the ci-snapshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Retro.NET.slnx

      - name: Build
        run: dotnet build Retro.NET.slnx -c Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test
        env:
          RETRO_SNAPSHOTS: ${{ github.workspace }}/artifacts/snapshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet test tests/Retro.Wpf.Tests/Retro.Wpf.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results --blame-hang-timeout 4m 2>&1 | Tee-Object -FilePath artifacts/test-results/console.log
          exit $LASTEXITCODE

      - name: Report test results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/test-results/console.log) {
            $tail = (Get-Content artifacts/test-results/console.log -Tail 80) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::notice title=dotnet test output (tail)::$tail"
          }
          $trx = Get-ChildItem artifacts/test-results -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Output "::error title=Tests::No test results were produced"; exit 0 }
          [xml]$x = Get-Content $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          Write-Output "::notice title=Test summary::total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed)"
          foreach ($r in @($x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })) {
            $msg = "$($r.Output.ErrorInfo.Message) | $($r.Output.ErrorInfo.StackTrace)" -replace "`r?`n", ' '
            if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
            Write-Output "::error title=$($r.testName)::$($r.outcome): $msg"
          }

      - name: Push UI snapshots to the ci-snapshots branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/snapshots | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP 'snapshots-branch'
          git init -q $dir
          Copy-Item artifacts/snapshots/* $dir
          Copy-Item artifacts/test-results -Recurse (Join-Path $dir 'test-results') -ErrorAction SilentlyContinue
          Set-Location $dir
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b ci-snapshots
          git add -A
          $out = (git commit -q --allow-empty -m "UI snapshots for ${{ github.sha }} (run ${{ github.run_number }})" 2>&1) -join ' '
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Snapshot commit::$out"; exit 1 }
          $out = (git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots 2>&1) -join ' '
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Snapshot push::$out"; exit 1 }

      - name: Upload test results & UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: |
            artifacts/snapshots
            artifacts/test-results
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack src/Retro.Wpf/Retro.Wpf.csproj -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
