<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Message strips" subtitle="Info / warning / error / success" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin:0; padding:12px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .sap-message svg { width: 14px; height: 14px; }
</style></head>
<body>
  <div class="stack">
    <div class="sap-message info"><svg><use href="../assets/icons.svg#info"/></svg>Document saved successfully. <span class="x">×</span></div>
    <div class="sap-message warning"><svg><use href="../assets/icons.svg#warning"/></svg>Verify totals before posting. <span class="x">×</span></div>
    <div class="sap-message error"><svg><use href="../assets/icons.svg#error"/></svg>Field "Carrier" is required. <span class="x" style="color:#fff">×</span></div>
    <div class="sap-message success"><svg><use href="../assets/icons.svg#success"/></svg>Posting complete — Document 6000068250 created. <span class="x">×</span></div>
  </div>
</body></html>
