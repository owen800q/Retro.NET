<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Tabs & Tags" subtitle="Tab strip + status tags" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="sap-tabs">
        <span class="sap-tab is-active">Active</span>
        <span class="sap-tab">Inactive</span>
        <span class="sap-tab" style="background:var(--accent-soft)">Hover</span>
        <span class="sap-tab is-disabled">Disabled</span>
      </div>
    </div>
    <div class="row">
      <span class="sap-tag">Info</span>
      <span class="sap-tag warning">Warning</span>
      <span class="sap-tag error">Error</span>
      <span class="sap-tag closable">Normal <span class="x">×</span></span>
      <span class="sap-tag warning closable">Warning <span class="x">×</span></span>
      <span class="sap-tag error closable">Error <span class="x">×</span></span>
    </div>
  </div>
</body></html>
