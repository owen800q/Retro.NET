<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Checkbox & Radio" subtitle="All four states" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface-2); box-shadow: var(--bevel-fieldset); }
  .col h4 { font-family: var(--font-bold); font-weight:700; font-size: 11px; margin: 0 0 4px; }
</style></head>
<body>
  <div class="grid">
    <div class="col">
      <h4>Checkbox</h4>
      <span class="sap-check"><span class="box"></span> Normal</span>
      <span class="sap-check is-checked"><span class="box"></span> Checked</span>
      <span class="sap-check is-disabled"><span class="box"></span> Disabled</span>
      <span class="sap-check"><span class="box" style="background:var(--accent-soft)"></span> Hover</span>
    </div>
    <div class="col">
      <h4>Radio</h4>
      <span class="sap-radio"><span class="box"></span> Normal</span>
      <span class="sap-radio is-checked"><span class="box"></span> Selected</span>
      <span class="sap-radio is-disabled"><span class="box"></span> Disabled</span>
      <span class="sap-radio"><span class="box" style="background:var(--accent-soft)"></span> Hover</span>
    </div>
  </div>
</body></html>
