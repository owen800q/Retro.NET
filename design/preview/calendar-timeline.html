<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Calendar & Timeline" subtitle="Date picker + event log" viewport="700x230" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .calc { padding: 8px; background: var(--surface-2); box-shadow: var(--bevel-out); }
  .calendar { width: 220px; }
  .calendar table { border-collapse: collapse; width: 100%; font-size: 10px; }
  .calendar th { font-family: var(--font-bold); font-weight: 700; padding: 1px 3px; text-align: center; background: var(--surface-3); }
  .calendar td { padding: 1px 3px; text-align: center; cursor: default; font-variant-numeric: tabular-nums; }
  .calendar td:hover { background: var(--accent-soft); }
  .calendar td.sel { background: var(--accent); color: #000; font-weight: 700; box-shadow: inset 0 0 0 1px #000; }
  .calendar td.dim { color: var(--fg-disabled); }
  .calendar .head { display:flex; justify-content: space-between; align-items: center; padding: 2px 4px; background: var(--gradient-titlebar); color:#fff; font-family: var(--font-bold); font-weight: 700; font-size: 11px; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .timeline { display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
  .timeline .ev { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
  .timeline .dot { width: 9px; height: 9px; background: var(--header-blue-2); margin: 4px 0 0 2px; box-shadow: 0 0 0 1px #000; }
  .timeline .ev:first-child .dot { background: var(--accent); }
  .timeline .ttl { font-weight: 700; font-size: 11px; }
  .timeline .sub { font-size: 10px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="calc calendar">
      <div class="head"><span>‹</span><span>March 2026</span><span>›</span></div>
      <table>
        <thead><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr></thead>
        <tbody>
          <tr><td class="dim">22</td><td class="dim">23</td><td class="dim">24</td><td class="dim">25</td><td class="dim">26</td><td class="dim">27</td><td class="dim">28</td></tr>
          <tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr>
          <tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr>
          <tr><td>15</td><td>16</td><td class="sel">17</td><td>18</td><td>19</td><td>20</td><td>21</td></tr>
          <tr><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td></tr>
          <tr><td>29</td><td>30</td><td>31</td><td class="dim">1</td><td class="dim">2</td><td class="dim">3</td><td class="dim">4</td></tr>
        </tbody>
      </table>
    </div>
    <div class="calc">
      <div style="font-family:var(--font-bold); font-weight:700; font-size:11px; margin-bottom:4px">Timeline</div>
      <div class="timeline">
        <div class="ev"><div class="dot"></div><div><div class="ttl">Document created</div><div class="sub">2026-03-17 14:55 · J. Müller</div></div></div>
        <div class="ev"><div class="dot"></div><div><div class="ttl">Items added (3)</div><div class="sub">2026-03-17 14:58 · J. Müller</div></div></div>
        <div class="ev"><div class="dot"></div><div><div class="ttl">Sent for approval</div><div class="sub">2026-03-17 15:02 · System</div></div></div>
      </div>
    </div>
  </div>
</body></html>
