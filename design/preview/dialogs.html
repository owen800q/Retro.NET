<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Dialogs" subtitle="Confirm + Message Box" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
</style></head>
<body>
  <div class="grid">
    <div class="sap-dialog">
      <div class="sap-titlebar"><span>Confirm Delete</span><span class="grow"></span><span class="sap-titlebar-btn">×</span></div>
      <div class="body" style="display:flex; gap:8px; align-items:flex-start">
        <svg width="32" height="32"><use href="../assets/icons.svg#warning"/></svg>
        <div>Delete document <b>6000068252</b>? This action cannot be undone.</div>
      </div>
      <div class="footer">
        <button class="sap-btn">OK</button>
        <button class="sap-btn">Cancel</button>
      </div>
    </div>
    <div class="sap-dialog">
      <div class="sap-titlebar"><span>Message Box</span><span class="grow"></span><span class="sap-titlebar-btn">×</span></div>
      <div class="body" style="display:flex; gap:8px; align-items:flex-start">
        <svg width="32" height="32"><use href="../assets/icons.svg#error"/></svg>
        <div><b>Field "Carrier" is required.</b><br><span style="color:var(--fg-muted)">Enter a value before saving.</span></div>
      </div>
      <div class="footer">
        <button class="sap-btn">OK</button>
      </div>
    </div>
  </div>
</body></html>
