<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Scale" subtitle="4px grid w/ 2px sub-grid" viewport="700x110" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .box { background: #2A6FB8; box-shadow: 0 0 0 1px #000; }
  .lbl { font-family: var(--font-mono); font-size: 9px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="width:2px; height:32px"></div><div class="lbl">2 · --space-1</div></div>
    <div class="item"><div class="box" style="width:4px; height:32px"></div><div class="lbl">4 · --space-2</div></div>
    <div class="item"><div class="box" style="width:6px; height:32px"></div><div class="lbl">6 · --space-3</div></div>
    <div class="item"><div class="box" style="width:8px; height:32px"></div><div class="lbl">8 · --space-4</div></div>
    <div class="item"><div class="box" style="width:12px; height:32px"></div><div class="lbl">12 · --space-5</div></div>
    <div class="item"><div class="box" style="width:16px; height:32px"></div><div class="lbl">16 · --space-6</div></div>
    <div class="item"><div class="box" style="width:20px; height:32px"></div><div class="lbl">20 · --space-7</div></div>
    <div class="item"><div class="box" style="width:24px; height:32px"></div><div class="lbl">24 · --space-8</div></div>
  </div>
</body></html>
