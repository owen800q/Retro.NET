<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Surfaces" subtitle="Desktop wash, panel, inset, toolbar" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; color: var(--fg); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sw  { height: 86px; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--border-dark), 0 0 0 1px #000; padding: 6px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-weight: 700; font-size: 11px; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .hex  { font-family: var(--font-mono); font-size: 10px; opacity: .8; }
  .light .name, .light .hex { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--surface)"><div class="name">surface</div><div class="hex">#D6E4F1</div></div>
    <div class="sw" style="background:var(--surface-2)"><div class="name">surface-2</div><div class="hex">#EAF1F8</div></div>
    <div class="sw" style="background:var(--surface-3)"><div class="name">surface-3</div><div class="hex">#F5F8FB</div></div>
    <div class="sw" style="background:var(--surface-inset)"><div class="name">surface-inset</div><div class="hex">#FFFFFF</div></div>
    <div class="sw" style="background:var(--surface-toolbar)"><div class="name">toolbar</div><div class="hex">#DCE6F2</div></div>
  </div>
</body></html>
