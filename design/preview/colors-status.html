<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Status" subtitle="Error, warning, info, success" viewport="700x120" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .item { background: var(--surface-2); padding: 8px; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--border-dark); }
  .strip { height: 28px; box-shadow: 0 0 0 1px #000; display:flex; align-items:center; padding: 0 8px; font-weight: 700; font-size: 11px; }
  .lbl { font-weight: 700; margin-bottom: 4px; font-size: 11px; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: .7; margin-top: 4px; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="lbl">Error</div><div class="strip" style="background:var(--status-error-bg); color:var(--status-error); box-shadow: inset 0 0 0 1px var(--status-error)">Field is required</div><div class="hex">#C8281E</div></div>
    <div class="item"><div class="lbl">Warning</div><div class="strip" style="background:var(--status-warning-bg); color:#8a5e00; box-shadow: inset 0 0 0 1px var(--status-warning)">Check totals</div><div class="hex">#E8A100</div></div>
    <div class="item"><div class="lbl">Info</div><div class="strip" style="background:var(--status-info-bg); color:var(--status-info); box-shadow: inset 0 0 0 1px var(--status-info)">Document saved.</div><div class="hex">#1F6BB8</div></div>
    <div class="item"><div class="lbl">Success</div><div class="strip" style="background:var(--status-success-bg); color:var(--status-success); box-shadow: inset 0 0 0 1px var(--status-success)">Posted</div><div class="hex">#2E8B3E</div></div>
  </div>
</body></html>
