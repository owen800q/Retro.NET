<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Logo" subtitle="Wordmark for the design system" viewport="700x110" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 14px; background: var(--surface); font-family: var(--font-system); font-size: 11px; display:flex; align-items:center; justify-content:center; }
  .frame { background: var(--surface); box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--border-dark), 0 0 0 1px #000; padding: 12px 14px; display:flex; align-items:center; gap: 12px; }
  .mark { display:flex; align-items:center; gap: 8px; }
  .badge {
    background: linear-gradient(180deg, #2A6FB8 0%, #6FA3D6 50%, #003D7A 100%);
    color: #fff;
    font-family: Tahoma, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 3px;
    padding: 4px 10px;
    box-shadow: 0 0 0 1px #001E3F;
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  .word { display:flex; flex-direction:column; }
  .w1 { font-family: Tahoma, sans-serif; font-weight: 700; font-size: 14px; color: var(--header-blue-1); letter-spacing: 1px; }
  .w2 { font-family: Tahoma, sans-serif; font-size: 9px; color: var(--fg-muted); letter-spacing: 1.5px; text-transform: uppercase; }
</style></head>
<body>
  <div class="frame">
    <div class="mark">
      <span class="badge">SAP</span>
      <div class="word">
        <span class="w1">RETRO GUI</span>
        <span class="w2">Design System v1.0</span>
      </div>
    </div>
  </div>
</body></html>
