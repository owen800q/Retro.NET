<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Header / Title bar" subtitle="Deep-blue gradient + gloss highlight" viewport="700x190" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface); font-family: var(--font-system); font-size: 11px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .sw  { height: 86px; box-shadow: inset 1px 1px 0 rgba(255,255,255,.4), inset -1px -1px 0 rgba(0,0,0,.4), 0 0 0 1px #000; padding: 6px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .name { font-weight: 700; }
  .hex  { font-family: var(--font-mono); font-size: 10px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--header-blue-1)"><div class="name">header-blue-1</div><div class="hex">#003D7A</div></div>
    <div class="sw" style="background:var(--header-blue-2)"><div class="name">header-blue-2</div><div class="hex">#2A6FB8</div></div>
    <div class="sw" style="background:var(--header-blue-3)"><div class="name">header-blue-3</div><div class="hex">#4A7FB8</div></div>
    <div class="sw" style="background:var(--header-gloss)"><div class="name">header-gloss</div><div class="hex">#6FA3D6</div></div>
  </div>
  <div style="margin-top:8px; height:30px; background: var(--gradient-titlebar); box-shadow: 0 0 0 1px #001E3F; padding: 6px 10px; color:#fff; font-family: var(--font-bold); font-weight:700; font-size:12px; display:flex; align-items:center; text-shadow: 0 1px 0 rgba(0,0,0,.4)">SAP — Shipment: Display 0000080014</div>
</body></html>
